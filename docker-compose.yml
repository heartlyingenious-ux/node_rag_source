# App + local Ollama. MongoDB stays on Atlas (DB in .env).
# First run: docker compose up -d && docker compose exec ollama ollama pull nomic-embed-text
#            docker compose exec ollama ollama pull llama3.2
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
